name: Validate Kakashi Learning
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test skill and ledger
        run: |
          python -m unittest discover -s tests -v
          python scripts/audit.py examples/agent-skills-format/ledger.json
          python scripts/audit.py examples/json-boundaries/ledger.json --ready
          python scripts/audit.py examples/skill-comparison/ledger.json
